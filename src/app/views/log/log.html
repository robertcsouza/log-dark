<div class="table-wrapper">
  <div class="search-container">
    <input
      type="text"
      placeholder="Pesquisar..."
      [(ngModel)]="searchTerm"
      (input)="applyFilter()"
      class="search-input"
    />
    <i class="pi pi-search search-icon"></i>
  </div>

<p-table [value]="logs"  [paginator]="true"  [rows]="10"  [rowsPerPageOptions]="[10, 100,500]" [scrollable]="true"
  scrollHeight="45rem" paginatorDropdownAppendTo="body" class="custom-table">
  <ng-template pTemplate="header">
    <tr>
      <th>ID</th>
      <th>Log ID</th>
      <th>User</th>
      <th>Date</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-log>
    <tr>
      <td>{{ log.id }}</td>
      <td>{{ log.log_id }}</td>
      <td>{{ log.user }}</td>
      <td>{{ log.date }}</td>
      <td style="text-align: center;">
          <button
            pButton
            type="button"
            icon="pi pi-search"
            class="p-button-rounded p-button-text action-btn"
            (click)="goToDetail(log.id)"
          ></button>
        </td>
    </tr>
  </ng-template>
</p-table>
</div>
